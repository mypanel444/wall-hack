name: Build Long Range SO
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Setup NDK
      uses: nttld/setup-ndk@v1
      with:
        ndk-version: r21e
    - name: Clone Dobby
      run: |
        git clone --recursive https://github.com/jmpews/Dobby.git
        # ITO YUNG MAGIC COMMAND PARA MA-FIX YUNG @PAGEOFF
        sed -i 's/@PAGEOFF/:lo12:/g' Dobby/source/TrampolineBridge/ClosureTrampolineBridge/arm64/*.S
    - name: Build with CMake
      run: |
        mkdir build
        cd build
        cmake -DCMAKE_TOOLCHAIN_FILE=$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake -DANDROID_ABI=arm64-v8a -DANDROID_PLATFORM=android-21 ..
        make
    - name: Upload SO
      uses: actions/upload-artifact@v4
      with:
        name: liblongrange
        path: build/liblongrange.so
